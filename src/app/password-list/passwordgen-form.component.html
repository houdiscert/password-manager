<div class="modal-overlay" (click)="closeModal()" animate.enter="backdrop-fade-in">
    <div class="modal-box content-box gen-form" (click)="noBubble($event)" animate.enter="modal-in">
        <h1>Generate a password</h1>
        <hr/>
        <!-- Character Set -->
        <div class="input-box no-mobile-width">
            <fieldset>
                <legend>Character Set</legend>
                <div class="checkbox-row">
                    <div class="checkbox-option">
                        <label for="lowercase">Lowercase</label>
                        <input class="form-checkbox" type="checkbox" [formControl]="lowercase" id="lowercase"/>
                    </div>
                    <div class="checkbox-option">
                        <label for="uppercase">Uppercase</label>
                        <input class="form-checkbox" type="checkbox" [formControl]="uppercase" id="uppercase"/>
                    </div>
                    <div class="checkbox-option">
                        <label for="numbers">Numbers</label>
                        <input class="form-checkbox" type="checkbox" [formControl]="numbers" id="numbers"/>
                    </div>
                    <div class="checkbox-option">
                        <label for="symbols">Symbols</label>
                        <input class="form-checkbox" type="checkbox" [formControl]="symbols" id="symbols"/>
                    </div>
                </div>
            </fieldset>
        </div>
        <div class="input-box">
            <label for="length">Password Length: {{length.value}}</label>
            <input type="range" min="0" max="70" [formControl]="length" id="length" class="gen-range"/>
            @if (length.invalid && length.touched) {
                <span class="form-error">Password Length should be at least 0</span>
            }
        </div>
        <div class="action-group">
            <button class="action-button cancel-button" (click)="closeModal()">Cancel</button>
            <button class="action-button" (click)="generatePassword()">Generate</button>
        </div>
        <pm-error-popdown [message]="errorMessage()"/>
    </div>
</div>
