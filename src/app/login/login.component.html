<pm-navbar [pages]="[['Login', 'login'], ['Create Account', 'signup']]" currentPage="login"/>
<img src="/static/logo.svg" width="96" height="96" draggable="false"/>
<h2 class="login-header">Login to the Password Manager</h2>
<form [formGroup]="loginForm" (ngSubmit)="completeLogin()">
    <!-- Email Input -->
    <div class="input-box">
        <label for="email">Email </label>
        <input type="text" formControlName="email" id="email" autocomplete="off" class="form-input"/>
        @if (loginForm.controls.email.invalid && loginForm.controls.email.touched) {
            <span class="form-error">Invalid email</span>
        }
    </div>
    <!-- Password Input -->
    <div class="input-box">
        <label for="password">Password </label>
        <input type="password" formControlName="password" id="password" autocomplete="off" class="form-input"/>
        @if (loginForm.controls.password.invalid && loginForm.controls.password.touched) {
            <span class="form-error">Password is required</span>
        }
    </div>

    <button type="submit" class="submit-button" [class.waiting]="submissionWaiting()">Login</button>
</form>

<pm-error-popdown [message]="errorMessage()"/>
